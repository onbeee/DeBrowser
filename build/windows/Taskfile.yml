version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds DeBrowser for Windows x64
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
      - cmd: powershell Remove-Item *.syso -ErrorAction SilentlyContinue
        platforms: [windows]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}}'
      ARCH: "amd64"
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"

  generate:syso:
    summary: Generates the Windows .syso resource file (icon, manifest, version info)
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default "amd64"}}'

  package:
    summary: Creates the NSIS installer (requires makensis on Windows)
    cmds:
      - task: create:nsis:installer

  create:nsis:installer:
    summary: Creates an NSIS installer for the built application
    dir: build/windows/nsis
    deps:
      - task: build
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - makensis -DARG_WAILS_AMD64_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi

  run:
    summary: Runs the built Windows application
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
