version: '3'

# DeBrowser tasks (Wails v3). Primary target: Windows x64.
# Run `wails3 dev` for development mode, `task build` for a production build.

vars:
  APP_NAME: "debrowser"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: 'Builds the application for the target OS (default: host OS)'
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: 'Packages a production build (Windows: NSIS installer)'
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the built application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
