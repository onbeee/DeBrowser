name: CI

# AGENTS.md section 8: Go formatting, Go tests, Go vet, frontend TypeScript
# checks, frontend production build and a Windows x64 application build,
# with the build artifact uploaded for review. Nothing is published.

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 checks and build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go format check
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error "These files are not gofmt-formatted: $unformatted"
            exit 1
          }
          Write-Host "gofmt clean"

      - name: Install Wails CLI v3.0.0
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Wails bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Verify generated bindings are committed
        shell: pwsh
        run: |
          git diff --exit-code -- frontend/bindings
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Generated bindings differ from the committed ones. Run 'wails3 generate bindings' locally and commit the result."
            exit 1
          }

      - name: Check UI language (Simplified Chinese only)
        shell: pwsh
        run: |
          $forbidden = @('Backend status', 'Coming in later stages', 'PLANNED MODULE', 'LOCAL-FIRST DESKTOP', 'Refresh status', 'Toggle console', 'No messages yet', 'Multi-profile browser manager', 'Project foundation is running', 'What Stage 1 includes', 'Browser Instances', 'Backup & Recovery')
          $hits = Select-String -Path frontend/src/*.tsx, frontend/src/*.ts, frontend/src/**/*.tsx, frontend/src/**/*.ts -Pattern $forbidden -SimpleMatch
          if ($hits) {
            $hits | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            Write-Error "English UI strings found. The UI is Simplified Chinese only."
            exit 1
          }
          Write-Host "UI language check passed"

      - name: Frontend type check
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - name: Generate placeholder application icon
        # build/appicon.png is a binary brand asset that is not committed
        # yet; use the Wails example icon so icon/.syso generation in the
        # build below runs end to end. See docs/DEVELOPMENT.md.
        working-directory: build
        run: wails3 generate icons -example

      - name: Build Windows x64 application (Wails v3)
        run: wails3 build

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeBrowser-windows-amd64
          path: bin/*.exe
          if-no-files-found: error
